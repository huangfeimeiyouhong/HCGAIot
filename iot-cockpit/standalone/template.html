<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23061230'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%2341C0FF' stroke-width='3'/%3E%3C/svg%3E" type="image/svg+xml">
<title>后厨管家 · IoT 设备全景监控大屏</title>
<style>
/* ===================== 设计令牌 ===================== */
:root{
  --primary:#41C0FF; --green:#07C160; --orange:#FA8C16; --red:#FF4D4F;
  --gray:#94A3B8; --map-empty:#0B2B4F; --map-low:#16507E; --map-high:#37D4CF;
  --text:#E6F1FF; --text-dim:#8FB3D9;
  --bg-0:#041234; --bg-1:#061a3d; --bg-2:#0a2551;
  --line:rgba(65,192,255,.18); --line-soft:rgba(65,192,255,.12);
  --fill:rgba(65,192,255,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020a1c}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.font-digital{font-family:"DIN Alternate","Bahnschrift","Impact","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.5px}

/* ===================== 等比缩放壳(1920×1080) ===================== */
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#screen{
  position:relative;width:1920px;height:1080px;flex:0 0 auto;
  transform-origin:center center;
  background:
    radial-gradient(1200px 600px at 50% -10%,rgba(65,192,255,.14),transparent 60%),
    radial-gradient(900px 500px at 8% 100%,rgba(7,193,96,.08),transparent 60%),
    radial-gradient(900px 500px at 92% 100%,rgba(55,212,207,.07),transparent 60%),
    linear-gradient(180deg,var(--bg-0) 0%,#031028 55%,#020a1c 100%);
  overflow:hidden;
}
/* 网格底纹 */
#screen::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(65,192,255,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(65,192,255,.045) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse at center,black 30%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 78%);
}

/* ===================== 顶部标题栏 ===================== */
.hd{position:relative;height:96px;display:flex;align-items:center;justify-content:center;z-index:3}
.hd__deco{position:absolute;left:50%;top:0;transform:translateX(-50%);width:1180px;height:96px;pointer-events:none}
.hd__title{
  position:relative;font-size:44px;font-weight:800;letter-spacing:6px;
  background:linear-gradient(180deg,#FFFFFF 20%,#8FD8FF 60%,#41C0FF 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 26px rgba(65,192,255,.45);white-space:nowrap;
}
.hd__crumb{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:10px}
.hd__crumb .sep{color:rgba(143,179,217,.5);font-size:16px}
.hd__crumb .cur{color:var(--primary);font-size:18px;font-weight:600}
.crumb-btn{
  background:transparent;border:1px solid rgba(65,192,255,.4);color:var(--text-dim);
  font-size:14px;padding:5px 12px;border-radius:4px;cursor:pointer;transition:.2s;
}
.crumb-btn:hover{color:#fff;border-color:var(--primary);background:rgba(65,192,255,.12)}
.hd__right{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:18px}
.hd__clock{text-align:right;line-height:1.25}
.hd__date{font-size:13px;color:var(--text-dim);letter-spacing:1px}
.hd__time{font-size:26px;color:#fff}
.icon-btn{
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(65,192,255,.35);border-radius:4px;background:rgba(65,192,255,.08);
  cursor:pointer;transition:.2s;
}
.icon-btn:hover{background:rgba(65,192,255,.2);border-color:var(--primary)}
.icon-btn svg{width:16px;height:16px;stroke:var(--primary);fill:none;stroke-width:1.8}

/* ===================== 主体三栏 ===================== */
.main{position:relative;z-index:2;display:flex;gap:20px;height:944px;padding:0 20px 20px}
.col{display:flex;flex-direction:column;gap:20px;min-width:0;height:100%}
.col--left{width:460px;flex:0 0 460px}
.col--center{flex:1}
.col--right{width:480px;flex:0 0 480px}

/* ===================== 面板 ===================== */
.panel{position:relative;display:flex;flex-direction:column;min-height:0;
  background:linear-gradient(180deg,rgba(10,37,81,.42),rgba(4,18,52,.28));
  border:1px solid rgba(65,192,255,.16);
}
.panel::before,.panel::after{content:'';position:absolute;width:16px;height:16px;pointer-events:none}
.panel::before{left:-1px;top:-1px;border-left:2px solid var(--primary);border-top:2px solid var(--primary)}
.panel::after{right:-1px;bottom:-1px;border-right:2px solid var(--primary);border-bottom:2px solid var(--primary)}
.panel__hd{position:relative;height:42px;flex:0 0 42px;display:flex;align-items:center;padding:0 14px;
  background:linear-gradient(90deg,rgba(65,192,255,.18),rgba(65,192,255,.02) 70%);}
.panel__hd::after{content:'';position:absolute;left:0;bottom:0;width:100%;height:1px;
  background:linear-gradient(90deg,rgba(65,192,255,.75),rgba(65,192,255,.05))}
.panel__title{font-size:20px;font-weight:700;letter-spacing:2px;color:#fff;display:flex;align-items:center;gap:8px}
.panel__title::before{content:'';width:3px;height:14px;background:var(--primary);border-radius:2px;box-shadow:0 0 8px var(--primary)}
.panel__extra{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-dim)}
.panel__bd{flex:1;min-height:0;padding:12px 14px;position:relative}
/* P1 内容区为纵向 flex,使 KPI 行固定高、环形图吃掉剩余空间 */
.p1 .panel__bd{display:flex;flex-direction:column}
.p1{height:440px;flex:0 0 440px}
.p4{height:380px;flex:0 0 380px}
/* 撑满剩余高度的弹性面板 */
.pflex{flex:1 1 auto;min-height:0}
.pflex .panel__bd{min-height:0}

/* ===================== P1 设备状态总览 ===================== */
.kpi-row{display:flex;gap:8px;height:78px;flex:0 0 78px}
.kpi-chip{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--fill);border:1px solid var(--line);border-radius:6px}
.kpi-chip__label{font-size:12px;color:var(--text-dim);white-space:nowrap}
.kpi-chip__value{font-size:27px;line-height:1.1}
.kpi-chip__sub{font-size:10px;color:rgba(143,179,217,.7);white-space:nowrap}
.donut-wrap{position:relative;flex:1;min-height:0;margin-top:10px}
/* flex 容器内 height:100% 会解析失败,改绝对定位撑满 */
.donut-wrap > .chart{position:absolute;inset:0}
.donut-center{position:absolute;left:32%;top:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:1}
.donut-center__value{font-size:31px;line-height:1;color:#fff}
.donut-center__label{margin-top:4px;font-size:12px;color:var(--text-dim)}
.chart{width:100%;height:100%}

/* ===================== P2 环境实时监测 ===================== */
.env-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;width:100%;height:100%}
.env-card{display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:8px 6px;background:var(--fill);border:1px solid var(--line);border-radius:6px;transition:.3s}
.env-card--warn{background:rgba(250,140,22,.08);border-color:rgba(250,140,22,.45)}
.env-card__hd{display:flex;align-items:center;gap:8px;justify-content:center}
.env-card__name{font-size:14px;color:#E6F1FF;white-space:nowrap}
.env-card__status{font-size:11px;padding:1px 6px;border-radius:3px;background:rgba(255,255,255,.08)}
.env-card__gauge{position:relative;width:118px;height:118px}
.env-card__gauge .gc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2px;pointer-events:none}
.env-card__gauge .gv{font-size:29px;line-height:1;color:#fff}
.env-card__gauge .gu{font-size:12px;color:rgba(255,255,255,.85);align-self:flex-start;margin-top:8px}
.env-card__th{font-size:11px;color:rgba(143,179,217,.75);white-space:nowrap}

/* ===================== P4 实时指标趋势 ===================== */
.rt{display:flex;gap:14px;width:100%;height:100%}
.rt__blk{flex:1;min-width:0;display:flex;flex-direction:column}
.rt__hd{height:28px;flex:0 0 28px;display:flex;align-items:center;justify-content:space-between}
.rt__t{font-size:15px;font-weight:600;color:#E6F1FF;display:flex;align-items:center;gap:6px}
.rt__t::before{content:'';width:3px;height:12px;background:var(--primary);border-radius:2px}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.badge--a{color:var(--primary);border:1px solid rgba(65,192,255,.4);background:rgba(65,192,255,.1)}
.badge--w{color:var(--map-high);border:1px solid rgba(55,212,207,.4);background:rgba(55,212,207,.1)}

/* ===================== P5 区域分布 ===================== */
.rmap{position:relative;width:100%;height:100%}
.rmap__chart{position:absolute;inset:0}
.rmap__overlay{position:absolute;top:4px;left:8px;display:flex;flex-direction:column;gap:8px;z-index:2}
.ostat{display:flex;align-items:baseline;gap:6px;padding:5px 10px;background:rgba(4,18,52,.72);
  border:1px solid rgba(65,192,255,.22);border-radius:4px}
.ostat__l{font-size:12px;color:rgba(143,179,217,.9)}
.ostat__v{font-size:20px;color:var(--primary)}
.rmap__legend{position:absolute;right:12px;bottom:10px;display:flex;align-items:center;gap:6px;z-index:2}
.rmap__legend span{font-size:11px;color:rgba(143,179,217,.85)}
.rmap__bar{width:110px;height:8px;border-radius:4px;background:linear-gradient(90deg,#0b2b4f,#16507e 50%,#37d4cf)}
.rmap__hint{position:absolute;left:8px;bottom:10px;display:flex;align-items:center;gap:6px;
  font-size:12px;color:rgba(143,179,217,.85);z-index:2}
.rmap__dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.city-list{position:absolute;right:10px;top:4px;width:196px;z-index:2;display:flex;flex-direction:column;gap:4px}
.city-row{display:flex;align-items:center;gap:8px;padding:4px 8px;background:rgba(4,18,52,.66);
  border:1px solid rgba(65,192,255,.14);border-radius:4px;font-size:12px}
.city-row__n{color:#E6F1FF;width:44px;flex:0 0 44px}
.city-row__bar{flex:1;height:5px;background:rgba(65,192,255,.12);border-radius:3px;overflow:hidden}
.city-row__bar i{display:block;height:100%;background:linear-gradient(90deg,#16507e,#37d4cf)}
.city-row__v{color:var(--primary);width:34px;text-align:right;font-size:12px}

/* ===================== P6 告警信息 ===================== */
.level-row{display:flex;gap:10px;height:86px;flex:0 0 86px}
.level-card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:var(--fill);border:1px solid var(--line);border-radius:6px}
.level-card__c{font-size:31px;line-height:1.05}
.level-card__l{font-size:13px;color:#E6F1FF}
.level-card__s{font-size:10px;color:rgba(143,179,217,.7)}
.ticker{flex:1;min-height:0;margin-top:12px;display:flex;flex-direction:column}
.ticker__hd{height:26px;flex:0 0 26px;display:flex;align-items:center;justify-content:space-between}
.ticker__t{font-size:15px;font-weight:600;color:#E6F1FF;display:flex;align-items:center;gap:6px}
.ticker__t::before{content:'';width:3px;height:12px;background:var(--primary);border-radius:2px}
.ticker__hint{font-size:11px;color:rgba(143,179,217,.6)}
.ticker__vp{flex:1;min-height:0;overflow:hidden;margin-top:4px}
.ticker__tr{transition:transform .6s cubic-bezier(.4,0,.2,1)}
.ticker__tr--no{transition:none}
.alarm{display:flex;gap:8px;height:92px;padding:7px 9px;margin-bottom:8px;
  background:rgba(65,192,255,.05);border:1px solid var(--line-soft);border-radius:6px;overflow:hidden}
.alarm__lv{flex:0 0 22px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#041234;font-weight:700;writing-mode:vertical-lr;letter-spacing:2px}
.alarm__bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.alarm__r1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.alarm__dev{font-size:14px;color:#E6F1FF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alarm__time{font-size:11px;color:rgba(143,179,217,.75);flex:0 0 auto;font-family:"DIN Alternate",Bahnschrift,sans-serif}
.alarm__r2,.alarm__ct{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alarm__r2{color:var(--text-dim)}
.alarm__ct{color:rgba(143,179,217,.65)}
.alarm-ft{flex:0 0 auto;margin-top:8px;text-align:center;font-size:11px;color:rgba(143,179,217,.55)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="viewport">
<div id="screen">

  <!-- ===================== 顶部 ===================== -->
  <header class="hd">
    <svg class="hd__deco" viewBox="0 0 1180 96" preserveAspectRatio="none">
      <defs>
        <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#41C0FF" stop-opacity="0"/>
          <stop offset=".5" stop-color="#41C0FF" stop-opacity=".55"/>
          <stop offset="1" stop-color="#41C0FF" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M0 70 L180 70 L240 40 L940 40 L1000 70 L1180 70" fill="none" stroke="url(#hg)" stroke-width="1"/>
      <path d="M240 40 L940 40 L1000 70 L1180 70 L1180 96 L0 96 L0 70 L180 70 Z" fill="#41C0FF" fill-opacity=".05"/>
      <circle cx="590" cy="40" r="3.5" fill="#41C0FF"/>
      <circle cx="590" cy="40" r="9" fill="none" stroke="#41C0FF" stroke-opacity=".45"/>
    </svg>

    <div class="hd__crumb">
      <button class="crumb-btn hidden" id="btnBack">← 返回全国</button>
      <span class="sep" id="crumbSep" style="display:none">/</span>
      <span class="cur" id="crumbCur">全国总览</span>
    </div>

    <h1 class="hd__title">后厨管家 · IoT 设备全景监控中心</h1>

    <div class="hd__right">
      <div class="hd__clock">
        <div class="hd__date font-digital" id="clockDate">2026-01-01 星期三</div>
        <div class="hd__time font-digital" id="clockTime">00:00:00</div>
      </div>
      <div class="icon-btn" id="btnFull" title="全屏">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke-linecap="round"/></svg>
      </div>
    </div>
  </header>

  <!-- ===================== 主体 ===================== -->
  <div class="main">

    <!-- 左栏 -->
    <div class="col col--left">
      <section class="panel p1">
        <div class="panel__hd"><div class="panel__title">设备状态总览</div>
          <div class="panel__extra" id="uptimeTxt">运行 128 天</div></div>
        <div class="panel__bd">
          <div class="kpi-row" id="kpiRow"></div>
          <div class="donut-wrap">
            <div class="donut-center">
              <div class="donut-center__value font-digital" id="donutTotal">0</div>
              <div class="donut-center__label">设备总数</div>
            </div>
            <div class="chart" id="chartDonut"></div>
          </div>
        </div>
      </section>

      <section class="panel pflex">
        <div class="panel__hd"><div class="panel__title">环境实时监测</div>
          <div class="panel__extra" id="envWarnTxt">全部正常</div></div>
        <div class="panel__bd"><div class="env-grid" id="envGrid"></div></div>
      </section>
    </div>

    <!-- 中栏 -->
    <div class="col col--center">
      <section class="panel p4">
        <div class="panel__hd"><div class="panel__title">实时指标趋势</div>
          <div class="panel__extra">近 24 小时</div></div>
        <div class="panel__bd">
          <div class="rt">
            <div class="rt__blk">
              <div class="rt__hd"><span class="rt__t">设备在线率趋势</span>
                <span class="badge badge--a" id="rateBadge">当前 --%</span></div>
              <div class="chart" id="chartRate"></div>
            </div>
            <div class="rt__blk">
              <div class="rt__hd"><span class="rt__t">今日告警趋势</span>
                <span class="badge badge--w" id="alarmBadge">累计 0 条</span></div>
              <div class="chart" id="chartAlarm"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel pflex">
        <div class="panel__hd"><div class="panel__title" id="mapTitle">区域分布视图</div>
          <div class="panel__extra" id="mapExtra">点击福建省可下钻</div></div>
        <div class="panel__bd">
          <div class="rmap">
            <div class="rmap__chart" id="chartMap"></div>
            <div class="rmap__overlay" id="mapOverlay"></div>
            <div class="city-list hidden" id="cityList"></div>
            <div class="rmap__legend"><span>设备密度</span><span class="rmap__bar"></span><span>低 → 高</span></div>
            <div class="rmap__hint" id="mapHint"><span class="rmap__dot"></span>点击高亮省份(福建)可下钻查看地市分布</div>
          </div>
        </div>
      </section>
    </div>

    <!-- 右栏 -->
    <div class="col col--right">
      <section class="panel" style="height:100%">
        <div class="panel__hd"><div class="panel__title">告警信息</div>
          <div class="panel__extra"><span class="rmap__dot" style="display:inline-block;vertical-align:middle;margin-right:6px"></span>实时推送</div></div>
        <div class="panel__bd" style="display:flex;flex-direction:column">
          <div class="level-row" id="levelRow"></div>
          <div class="ticker" id="ticker">
            <div class="ticker__hd"><span class="ticker__t">实时告警</span><span class="ticker__hint">hover 暂停滚动</span></div>
            <div class="ticker__vp"><div class="ticker__tr" id="tickerTrack"></div></div>
          </div>
          <div class="alarm-ft">每 60s 自动刷新 · 数据来源:各厂商平台告警推送</div>
        </div>
      </section>
    </div>

  </div>
</div>
</div>

<script>/*__ECHARTS__*/</script>

<script>
/* =========================================================================
 * 后厨管家 · IoT 设备全景监控大屏 —— 单文件静态版
 * 零构建 / 零后端 / 双击即开；数据为演示 mock，60s 静默刷新
 * 接入真实平台：把 fetchData() 内的 mock 生成器换成 HTTP 请求即可
 * ========================================================================= */
(function () {
'use strict';

var C = {
  PRIMARY:'#41C0FF', GREEN:'#07C160', ORANGE:'#FA8C16', RED:'#FF4D4F',
  GRAY:'#94A3B8', MAP_EMPTY:'#0B2B4F', MAP_LOW:'#16507E', MAP_HIGH:'#37D4CF',
  TEXT:'#E6F1FF', TEXT_DIM:'#8FB3D9'
};
var LEVEL_COLOR = { urgent:C.RED, important:C.ORANGE, normal:C.PRIMARY };
var LEVEL_TEXT  = { urgent:'紧急', important:'重要', normal:'一般' };
var PLATFORM_LINES = ['安全生产','食品安全','环境消杀','经营分析','视频监控'];
var PLATFORM_COLORS = ['#41C0FF','#07C160','#FA8C16','#B78FFF','#37D4CF'];
var PLATFORM_BASE = { '安全生产':168, '食品安全':142, '环境消杀':96, '经营分析':64, '视频监控':48 };
var DRILLABLE = '35';

/* ---------------- 工具 ---------------- */
function ri(a,b){ return Math.round(a + Math.random()*(b-a)); }
function rf(a,b,d){ d = d===undefined?1:d; return Number((a + Math.random()*(b-a)).toFixed(d)); }
function p2(n){ return String(n).padStart(2,'0'); }
function fmt(n){ return Number(n).toLocaleString('en-US'); }
function el(id){ return document.getElementById(id); }

/* ---------------- Mock 数据生成 ---------------- */
function genPlatformShare(){
  return PLATFORM_LINES.map(function(n){
    return { name:n, value: PLATFORM_BASE[n] + ri(-3,3) };
  });
}
function genDeviceSummary(share){
  var total = share.reduce(function(s,x){ return s + x.value; },0);
  var offline = ri(5,12), online = total - offline;
  return { total:total, online:online, offline:offline,
           alarmToday:ri(6,18), onlineRate:Number((online/total*100).toFixed(1)) };
}
function genEnvMetrics(){
  var temp = rf(2.5,6.5,1), humidity = ri(55,72), oil = rf(0.4,1.4,2), gas = ri(0,8);
  return [

function regionColor(devices, max){
  if (devices <= 0) return C.MAP_EMPTY;
  var ratio = Math.min(devices/max, 1);
  var lerp = function(a,b,t){ return Math.round(a+(b-a)*t); };
  var stops = [[11,43,79],[22,80,126],[55,212,207]];
  var seg = ratio < 0.5 ? 0 : 1;
  var t = ratio < 0.5 ? ratio/0.5 : (ratio-0.5)/0.5;
  var a = stops[seg], b = stops[seg+1];
  return 'rgb('+lerp(a[0],b[0],t)+','+lerp(a[1],b[1],t)+','+lerp(a[2],b[2],t)+')';
}

        '<span class="alarm__time">'+it.time+'</span></div>'+
        '<div class="alarm__r2">'+it.platform+' · '+it.location+'</div>'+
        '<div class="alarm__ct">'+it.content+'</div>'+
      '</div></div>';
  }).join('');
  tickIdx = 0; tickAnim = false;
  track.classList.add('ticker__tr--no');
  track.style.transform = 'translateY(0px)';
  requestAnimationFrame(function(){
    tickAnim = true;
    track.classList.remove('ticker__tr--no');
  });
}

function tick(){
  var track = el('tickerTrack');
  if (alarmData.length <= VISIBLE){ track.style.transform = 'translateY(0px)'; return; }
  if (tickIdx >= alarmData.length){
    track.classList.add('ticker__tr--no');
    tickIdx = 0;
    track.style.transform = 'translateY(0px)';
    requestAnimationFrame(function(){ track.classList.remove('ticker__tr--no'); });
  } else {
    tickIdx++;
    track.style.transform = 'translateY(' + (-tickIdx*ITEM_STEP) + 'px)';
  }
}
function startTick(){
  stopTick();
  tickTimer = setInterval(tick, 3000);
}
function stopTick(){ if (tickTimer){ clearInterval(tickTimer); tickTimer = null; } }

/* =========================================================================
 * 数据装载 / 轮询
 * ========================================================================= */
function fetchData(){
  /* ★ 接入真实平台时:把以下 mock 换成 fetch('/api/iot/xxx').then(r=>r.json()) */
  return Promise.resolve({
    share:  genPlatformShare(),
    env:    genEnvMetrics(),
    trend:  genTrend(),
    levels: genAlarmLevels(),
    alarms: genAlarmList(),
    provinces: genProvinces()
  });
}

function render(d){
  var summary = genDeviceSummary(d.share);
  renderKPI(summary);
  renderDonut(d.share, summary);
  renderEnv(d.env);
  renderRate(d.trend);
  renderLevels(d.levels);
  renderAlarms(d.alarms);
  currentProvinces = d.provinces;
  if (!currentFujian) currentFujian = genFujianDetail();
  renderMap();
  bindMapClick();
}

function loadAll(){
  return fetchData().then(render).catch(function(e){ console.error('[IoT大屏] 数据刷新失败,保持原值:', e); });
}

/* ---------------- 时钟 ---------------- */
var WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function tickClock(){
  var d = new Date();
  el('clockDate').textContent = d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+WEEK[d.getDay()];
  el('clockTime').textContent = p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
}

/* ---------------- 等比缩放 ---------------- */
function fitScreen(){
  var s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  el('screen').style.transform = 'scale('+s+')';
}
window.addEventListener('resize', function(){
  fitScreen();
  Object.keys(charts).forEach(function(k){ if (charts[k]) charts[k].resize(); });
});

/* ---------------- 启动 ---------------- */
el('btnBack').addEventListener('click', function(){
  mapMode = 'china';
  renderMap();
});
el('ticker').addEventListener('mouseenter', stopTick);
el('ticker').addEventListener('mouseleave', startTick);
el('btnFull').addEventListener('click', function(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
});

fitScreen();
tickClock();
loadAll();
startTick();
setInterval(tickClock, 1000);
setInterval(loadAll, 60000);   /* 60s 静默刷新 */

/* 调试钩子:控制台可用 __iot 做数据探查 */
window.__iot = {
  get charts(){ return charts; },
  get mapMode(){ return mapMode; },
  drill: function(){ currentFujian = genFujianDetail(); mapMode='fujian'; renderMap(); },
  back:  function(){ mapMode='china'; renderMap(); }
};
})();
</script>
