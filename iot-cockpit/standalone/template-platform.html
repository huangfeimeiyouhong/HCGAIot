<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23061230'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%2341C0FF' stroke-width='3'/%3E%3C/svg%3E" type="image/svg+xml">
<title>后厨管家 · AIoT 平台运营监控中心</title>
<style>
/* ===================== 设计令牌 ===================== */
:root{
  --primary:#41C0FF; --green:#07C160; --orange:#FA8C16; --red:#FF4D4F;
  --purple:#B78FFF; --teal:#37D4CF; --gray:#94A3B8;
  --map-empty:#0B2B4F; --map-low:#16507E; --map-high:#37D4CF;
  --text:#E6F1FF; --text-dim:#8FB3D9;
  --bg-0:#041234; --bg-1:#061a3d; --bg-2:#0a2551;
  --line:rgba(65,192,255,.18); --line-soft:rgba(65,192,255,.12);
  --fill:rgba(65,192,255,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020a1c}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.font-digital{font-family:"DIN Alternate","Bahnschrift","Impact","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.5px}

/* ===================== 等比缩放壳(1920×1080) ===================== */
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#screen{
  position:relative;width:1920px;height:1080px;flex:0 0 auto;
  transform-origin:center center;
  background:
    radial-gradient(1200px 600px at 50% -10%,rgba(65,192,255,.14),transparent 60%),
    radial-gradient(900px 500px at 8% 100%,rgba(7,193,96,.08),transparent 60%),
    radial-gradient(900px 500px at 92% 100%,rgba(183,143,255,.07),transparent 60%),
    linear-gradient(180deg,var(--bg-0) 0%,#031028 55%,#020a1c 100%);
  overflow:hidden;
}
#screen::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(65,192,255,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(65,192,255,.045) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse at center,black 30%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 78%);
}

/* ===================== 顶部标题栏 ===================== */
.hd{position:relative;height:84px;display:flex;align-items:center;justify-content:center;z-index:3}
.hd__deco{position:absolute;left:50%;top:0;transform:translateX(-50%);width:1180px;height:84px;pointer-events:none}
.hd__title{
  position:relative;font-size:40px;font-weight:800;letter-spacing:6px;
  background:linear-gradient(180deg,#FFFFFF 20%,#8FD8FF 60%,#41C0FF 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 26px rgba(65,192,255,.45);white-space:nowrap;
}
.hd__crumb{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:10px}
.hd__crumb .cur{color:var(--primary);font-size:16px;font-weight:600}
.hd__right{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:18px}
.hd__clock{text-align:right;line-height:1.25}
.hd__date{font-size:13px;color:var(--text-dim);letter-spacing:1px}
.hd__time{font-size:24px;color:#fff}
.icon-btn{
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(65,192,255,.35);border-radius:4px;background:rgba(65,192,255,.08);
  cursor:pointer;transition:.2s;
}
.icon-btn:hover{background:rgba(65,192,255,.2);border-color:var(--primary)}
.icon-btn svg{width:16px;height:16px;stroke:var(--primary);fill:none;stroke-width:1.8}

/* ===================== 平台运行状态条 ===================== */
.strip{
  position:relative;height:68px;flex:0 0 68px;display:flex;align-items:center;
  margin:0 20px 14px;padding:0 18px;gap:0;
  background:linear-gradient(90deg,rgba(65,192,255,.10),rgba(7,193,96,.05) 60%,rgba(183,143,255,.06));
  border:1px solid var(--line);border-radius:8px;z-index:2;
}
.strip__label{
  flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;padding-right:18px;margin-right:6px;
  border-right:1px solid var(--line-soft);
}
.strip__label b{font-size:15px;color:#fff;letter-spacing:1px}
.strip__label span{font-size:11px;color:rgba(143,179,217,.7)}
.strip__item{
  flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:0 14px;
  border-right:1px solid var(--line-soft);height:42px;
}
.strip__item:last-child{border-right:none}
.strip__ico{width:10px;height:10px;border-radius:50%;flex:0 0 10px;box-shadow:0 0 8px currentColor}
.strip__meta{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.strip__l{font-size:12px;color:rgba(143,179,217,.9);white-space:nowrap}
.strip__v{font-size:21px;color:#fff;white-space:nowrap}
.strip__v small{font-size:12px;color:rgba(143,179,217,.8);margin-left:2px}

/* ===================== 主体三栏 ===================== */
.main{position:relative;z-index:2;display:flex;gap:20px;height:894px;padding:0 20px 20px}
.col{display:flex;flex-direction:column;gap:20px;min-width:0;height:100%}
.col--left{width:472px;flex:0 0 472px}
.col--center{flex:1}
.col--right{width:488px;flex:0 0 488px}

/* ===================== 面板 ===================== */
.panel{position:relative;display:flex;flex-direction:column;min-height:0;
  background:linear-gradient(180deg,rgba(10,37,81,.42),rgba(4,18,52,.28));
  border:1px solid rgba(65,192,255,.16);
}
.panel::before,.panel::after{content:'';position:absolute;width:16px;height:16px;pointer-events:none}
.panel::before{left:-1px;top:-1px;border-left:2px solid var(--primary);border-top:2px solid var(--primary)}
.panel::after{right:-1px;bottom:-1px;border-right:2px solid var(--primary);border-bottom:2px solid var(--primary)}
.panel__hd{position:relative;height:42px;flex:0 0 42px;display:flex;align-items:center;padding:0 14px;
  background:linear-gradient(90deg,rgba(65,192,255,.18),rgba(65,192,255,.02) 70%);}
.panel__hd::after{content:'';position:absolute;left:0;bottom:0;width:100%;height:1px;
  background:linear-gradient(90deg,rgba(65,192,255,.75),rgba(65,192,255,.05))}
.panel__title{font-size:20px;font-weight:700;letter-spacing:2px;color:#fff;display:flex;align-items:center;gap:8px}
.panel__title::before{content:'';width:3px;height:14px;background:var(--primary);border-radius:2px;box-shadow:0 0 8px var(--primary)}
.panel__extra{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-dim)}
.back-btn{
  background:transparent;border:1px solid rgba(65,192,255,.4);color:var(--text-dim);
  font-size:13px;padding:3px 10px;border-radius:4px;cursor:pointer;transition:.2s;
}
.back-btn:hover{color:#fff;border-color:var(--primary);background:rgba(65,192,255,.12)}
.panel__bd{flex:1;min-height:0;padding:12px 14px;position:relative}
.p1{height:430px;flex:0 0 430px}
.p1 .panel__bd{display:flex;flex-direction:column}
.p2 .panel__bd{display:flex;flex-direction:column}
.p3{height:344px;flex:0 0 344px}
.p6{height:356px;flex:0 0 356px}
.pflex{flex:1 1 auto;min-height:0}
.pflex .panel__bd{min-height:0}
.chart{width:100%;height:100%}

/* ===================== P1 平台经营总览 ===================== */
.kpi-row{display:flex;gap:8px;height:74px;flex:0 0 74px}
.kpi-chip{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:var(--fill);border:1px solid var(--line);border-radius:6px}
.kpi-chip__label{font-size:12px;color:var(--text-dim);white-space:nowrap}
.kpi-chip__value{font-size:25px;line-height:1.1}
.kpi-chip__sub{font-size:10px;color:rgba(143,179,217,.7);white-space:nowrap}
.donut-wrap{position:relative;flex:1;min-height:0;margin-top:10px}
.donut-wrap > .chart{position:absolute;inset:0}
.donut-center{position:absolute;left:32%;top:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:1}
.donut-center__value{font-size:30px;line-height:1;color:#fff}
.donut-center__label{margin-top:4px;font-size:12px;color:var(--text-dim)}
.sub-row{display:flex;gap:8px;height:50px;flex:0 0 50px;margin-top:10px}
.sub-chip{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:rgba(255,255,255,.03);border:1px solid var(--line-soft);border-radius:6px}
.sub-chip__v{font-size:18px;color:var(--primary)}
.sub-chip__l{font-size:11px;color:rgba(143,179,217,.85)}

/* ===================== P2 工单调度 ===================== */
.wo-block{display:flex;flex-direction:column;min-height:0;flex:1}
.wo-hd{height:24px;flex:0 0 24px;display:flex;align-items:center;justify-content:space-between}
.wo-hd b{font-size:14px;color:#E6F1FF;display:flex;align-items:center;gap:6px}
.wo-hd b::before{content:'';width:3px;height:12px;background:var(--primary);border-radius:2px}
.wo-hd span{font-size:12px;color:var(--text-dim)}
.wo-bar-wrap{flex:0 0 86px;margin-top:6px;position:relative}
.load-wrap{flex:1;min-height:0;margin-top:10px;position:relative}
.load-chart{position:absolute;inset:0}
.wo-foot{display:flex;gap:10px;height:48px;flex:0 0 48px;margin-top:8px}
.wo-foot__chip{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:var(--fill);border:1px solid var(--line);border-radius:6px}
.wo-foot__v{font-size:22px}
.wo-foot__l{font-size:11px;color:rgba(143,179,217,.85)}

/* ===================== P3 核心指标趋势 ===================== */
.trend{display:flex;gap:14px;width:100%;height:100%}
.trend__blk{flex:1;min-width:0;display:flex;flex-direction:column}
.trend__hd{height:26px;flex:0 0 26px;display:flex;align-items:center;justify-content:space-between}
.trend__t{font-size:14px;font-weight:600;color:#E6F1FF;display:flex;align-items:center;gap:6px}
.trend__t::before{content:'';width:3px;height:12px;background:var(--primary);border-radius:2px}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.badge--a{color:var(--primary);border:1px solid rgba(65,192,255,.4);background:rgba(65,192,255,.1)}
.badge--w{color:var(--teal);border:1px solid rgba(55,212,207,.4);background:rgba(55,212,207,.1)}

/* ===================== P4 厂商·客户地域覆盖 ===================== */
.rmap{position:relative;width:100%;height:100%}
.rmap__chart{position:absolute;inset:0}
.rmap__overlay{position:absolute;top:4px;left:8px;display:flex;flex-direction:column;gap:8px;z-index:2}
.ostat{display:flex;align-items:baseline;gap:6px;padding:5px 10px;background:rgba(4,18,52,.72);
  border:1px solid rgba(65,192,255,.22);border-radius:4px}
.ostat__l{font-size:12px;color:rgba(143,179,217,.9)}
.ostat__v{font-size:20px;color:var(--primary)}
.rmap__legend{position:absolute;right:12px;bottom:10px;display:flex;align-items:center;gap:6px;z-index:2}
.rmap__legend span{font-size:11px;color:rgba(143,179,217,.85)}
.rmap__bar{width:110px;height:8px;border-radius:4px;background:linear-gradient(90deg,#0b2b4f,#16507e 50%,#37d4cf)}
.rmap__hint{position:absolute;left:8px;bottom:10px;display:flex;align-items:center;gap:6px;
  font-size:12px;color:rgba(143,179,217,.85);z-index:2}
.rmap__dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.city-list{position:absolute;right:10px;top:4px;width:200px;z-index:2;display:flex;flex-direction:column;gap:4px}
.city-row{display:flex;align-items:center;gap:8px;padding:4px 8px;background:rgba(4,18,52,.66);
  border:1px solid rgba(65,192,255,.14);border-radius:4px;font-size:12px}
.city-row__n{color:#E6F1FF;width:46px;flex:0 0 46px}
.city-row__bar{flex:1;height:5px;background:rgba(65,192,255,.12);border-radius:3px;overflow:hidden}
.city-row__bar i{display:block;height:100%;background:linear-gradient(90deg,#16507e,#37d4cf)}
.city-row__v{color:var(--primary);width:34px;text-align:right;font-size:12px}

/* ===================== P5 异常告警中心 ===================== */
.level-row{display:flex;gap:10px;height:80px;flex:0 0 80px}
.level-card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:var(--fill);border:1px solid var(--line);border-radius:6px;position:relative;overflow:hidden}
.level-card__c{font-size:29px;line-height:1.05}
.level-card__l{font-size:13px;color:#E6F1FF}
.level-card__s{font-size:10px;color:rgba(143,179,217,.7)}
.src-wrap{height:150px;flex:0 0 150px;margin-top:12px;display:flex;gap:10px}
.src-pie{flex:1;min-width:0;position:relative}
.src-legend{flex:0 0 150px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.src-legend__item{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(230,241,255,.9)}
.src-legend__dot{width:9px;height:9px;border-radius:2px;flex:0 0 9px}
.src-legend__v{margin-left:auto;color:#fff}
.ticker{flex:1;min-height:0;margin-top:12px;display:flex;flex-direction:column}
.ticker__hd{height:26px;flex:0 0 26px;display:flex;align-items:center;justify-content:space-between}
.ticker__t{font-size:15px;font-weight:600;color:#E6F1FF;display:flex;align-items:center;gap:6px}
.ticker__t::before{content:'';width:3px;height:12px;background:var(--primary);border-radius:2px}
.ticker__hint{font-size:11px;color:rgba(143,179,217,.6)}
.ticker__vp{flex:1;min-height:0;overflow:hidden;margin-top:4px}
.ticker__tr{transition:transform .6s cubic-bezier(.4,0,.2,1)}
.ticker__tr--no{transition:none}
.alarm{display:flex;gap:8px;height:78px;padding:7px 9px;margin-bottom:8px;
  background:rgba(65,192,255,.05);border:1px solid var(--line-soft);border-radius:6px;overflow:hidden}
.alarm__lv{flex:0 0 22px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#041234;font-weight:700;writing-mode:vertical-lr;letter-spacing:2px}
.alarm__bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.alarm__r1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.alarm__sub{font-size:14px;color:#E6F1FF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alarm__time{font-size:11px;color:rgba(143,179,217,.75);flex:0 0 auto;font-family:"DIN Alternate",Bahnschrift,sans-serif}
.alarm__r2{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alarm__ct{font-size:12px;color:rgba(143,179,217,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alarm-ft{flex:0 0 auto;margin-top:8px;text-align:center;font-size:11px;color:rgba(143,179,217,.55)}

/* ===================== P6 关键绩效 & 运营待办 ===================== */
.kpi-score{display:flex;gap:8px;height:92px;flex:0 0 92px}
.score{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--fill);border:1px solid var(--line);border-radius:6px;position:relative}
.score__v{font-size:24px;line-height:1.05;color:#fff}
.score__l{font-size:11px;color:rgba(143,179,217,.9)}
.score__t{font-size:10px;color:rgba(143,179,217,.6)}
.score__bar{position:absolute;left:0;bottom:0;height:3px;background:var(--green);border-radius:0 0 6px 6px}
.todo{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;margin-top:12px;justify-content:center}
.todo__item{display:flex;align-items:center;gap:10px;padding:0 12px;height:40px;flex:0 0 40px;
  background:rgba(255,255,255,.03);border:1px solid var(--line-soft);border-radius:6px}
.todo__dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;box-shadow:0 0 8px currentColor}
.todo__l{font-size:14px;color:#E6F1FF;flex:1}
.todo__v{font-size:24px;color:#fff}
.todo__u{font-size:11px;color:rgba(143,179,217,.6);margin-left:4px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="viewport">
<div id="screen">

  <!-- ===================== 顶部 ===================== -->
  <header class="hd">
    <svg class="hd__deco" viewBox="0 0 1180 84" preserveAspectRatio="none">
      <defs>
        <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#41C0FF" stop-opacity="0"/>
          <stop offset=".5" stop-color="#41C0FF" stop-opacity=".55"/>
          <stop offset="1" stop-color="#41C0FF" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M0 60 L180 60 L240 34 L940 34 L1000 60 L1180 60" fill="none" stroke="url(#hg)" stroke-width="1"/>
      <path d="M240 34 L940 34 L1000 60 L1180 60 L1180 84 L0 84 L0 60 L180 60 Z" fill="#41C0FF" fill-opacity=".05"/>
      <circle cx="590" cy="34" r="3.5" fill="#41C0FF"/>
      <circle cx="590" cy="34" r="9" fill="none" stroke="#41C0FF" stroke-opacity=".45"/>
    </svg>

    <div class="hd__crumb">
      <span class="cur">平台运营视角 · 总览大屏</span>
    </div>

    <h1 class="hd__title">后厨管家 · AIoT 平台运营监控中心</h1>

    <div class="hd__right">
      <div class="hd__clock">
        <div class="hd__date font-digital" id="clockDate">2026-01-01 星期三</div>
        <div class="hd__time font-digital" id="clockTime">00:00:00</div>
      </div>
      <div class="icon-btn" id="btnFull" title="全屏">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke-linecap="round"/></svg>
      </div>
    </div>
  </header>

  <!-- ===================== 平台整体运行状态 ===================== -->
  <div class="strip" id="strip"></div>

  <!-- ===================== 主体 ===================== -->
  <div class="main">

    <!-- 左栏 -->
    <div class="col col--left">
      <section class="panel p1">
        <div class="panel__hd"><div class="panel__title">平台经营总览</div>
          <div class="panel__extra" id="bizExtra">核心资产规模</div></div>
        <div class="panel__bd">
          <div class="kpi-row" id="kpiRow"></div>
          <div class="donut-wrap">
            <div class="donut-center">
              <div class="donut-center__value font-digital" id="donutTotal">0</div>
              <div class="donut-center__label">入驻厂家</div>
            </div>
            <div class="chart" id="chartDonut"></div>
          </div>
          <div class="sub-row" id="subRow"></div>
        </div>
      </section>

      <section class="panel p2 pflex">
        <div class="panel__hd"><div class="panel__title">工单调度中心</div>
          <div class="panel__extra" id="woExtra">资源调度实时</div></div>
        <div class="panel__bd">
          <div class="wo-block">
            <div class="wo-hd"><b>工单状态分布</b><span id="woTotalTxt">--</span></div>
            <div class="wo-bar-wrap"><div class="chart" id="chartWoStatus"></div></div>
            <div class="wo-hd" style="margin-top:12px"><b>厂家负载 TOP5</b><span>待接单积压</span></div>
            <div class="load-wrap"><div class="load-chart" id="chartLoad"></div></div>
            <div class="wo-foot" id="woFoot"></div>
          </div>
        </div>
      </section>
    </div>

    <!-- 中栏 -->
    <div class="col col--center">
      <section class="panel p3">
        <div class="panel__hd"><div class="panel__title">核心运营指标趋势</div>
          <div class="panel__extra">近 7 日</div></div>
        <div class="panel__bd">
          <div class="trend">
            <div class="trend__blk">
              <div class="trend__hd"><span class="trend__t">工单量</span><span class="badge badge--a" id="woBadge">--</span></div>
              <div class="chart" id="chartWoTrend"></div>
            </div>
            <div class="trend__blk">
              <div class="trend__hd"><span class="trend__t">设备在线率</span><span class="badge badge--w" id="onlineBadge">--%</span></div>
              <div class="chart" id="chartOnline"></div>
            </div>
            <div class="trend__blk">
              <div class="trend__hd"><span class="trend__t">SLA 达标率</span><span class="badge badge--a" id="slaBadge">--%</span></div>
              <div class="chart" id="chartSla"></div>
            </div>
          </div>
        </div>
      </section>

/* ---------- P4 地图 ---------- */
function regionColor(customers, max){
  if (customers <= 0) return C.MAP_EMPTY;
  var ratio = Math.min(customers/max, 1);
  var lerp = function(a,b,t){ return Math.round(a+(b-a)*t); };
  var stops = [[11,43,79],[22,80,126],[55,212,207]];
  var seg = ratio < 0.5 ? 0 : 1;
  var t = ratio < 0.5 ? ratio/0.5 : (ratio-0.5)/0.5;
  var a = stops[seg], b = stops[seg+1];
  return 'rgb('+lerp(a[0],b[0],t)+','+lerp(a[1],b[1],t)+','+lerp(a[2],b[2],t)+')';
}
var mapMode = 'china';
var currentRegions = [];
var currentFujian = null;
function mapOptionForChina(){
  var max = Math.max.apply(null, currentRegions.map(function(p){ return p.customers; }).concat([1]));
  var byName = {}; currentRegions.forEach(function(p){ byName[p.name] = p; });
  return {
    backgroundColor:'transparent',
    tooltip: Object.assign({}, tipCommon, { trigger:'item',
      formatter:function(pr){
        if (pr.seriesType === 'effectScatter'){
          var d = pr.data.raw || {};
          return '<span style="color:#07C160">'+pr.name+'</span><br/>入驻厂家:'+d.vendors+' · 客户食堂:'+d.customers;
        }
        var r = byName[pr.name];
        if (!r) return pr.name + '<br/><span style="color:#8FB3D9">暂无入驻</span>';
        return '<span style="color:#41C0FF">'+r.name+'</span>' +
          '<br/>入驻厂家:'+r.vendors+' · 客户食堂:'+r.customers;
      } }),
    geo:{ map:'china', roam:true, scaleLimit:{min:0.8,max:4},
      layoutCenter:['50%','52%'], layoutSize:'100%', zoom:1.02, aspectScale:1.0,
      label:{show:false},
      itemStyle:{ areaColor:C.MAP_EMPTY, borderColor:'rgba(127,148,238,0.55)', borderWidth:1 },
      emphasis:{ label:{show:true,color:'#fff',fontSize:13},
        itemStyle:{ areaColor:'rgba(65,192,255,0.45)', borderColor:C.PRIMARY, borderWidth:2 } },
      select:{ disabled:true },
      regions: currentRegions.map(function(p){
        return { name:p.name,
          itemStyle:{ areaColor: p.adcode===DRILLABLE ? 'rgba(7,193,96,0.38)' : regionColor(p.customers,max),
            borderColor: p.adcode===DRILLABLE ? C.GREEN : 'rgba(127,148,238,0.55)',
            borderWidth: p.adcode===DRILLABLE ? 2 : 1 },
          label:{ show:p.customers>0, color:C.TEXT, fontSize:12 } };
      })
    },
    series:[{ type:'effectScatter', coordinateSystem:'geo', silent:true, zlevel:2,
      rippleEffect:{ brushType:'stroke', scale:3, period:4 }, symbolSize:function(val){ return 6 + val[2]*2.2; },
      itemStyle:{ color:C.GREEN, shadowBlur:8, shadowColor:C.GREEN },
      data: currentRegions.filter(function(p){ return p.vendors>0; }).map(function(p){
        var c = PROV_CENTER[p.name];
        return { name:p.name, value:[c[0],c[1],p.vendors], raw:{vendors:p.vendors,customers:p.customers} };
      }) }]
  };
}
function mapOptionForFujian(){
  var cities = currentFujian.cities;
  var max = Math.max.apply(null, cities.map(function(c){ return c.customers; }).concat([1]));
  var byName = {}; cities.forEach(function(c){ byName[c.name] = c; });
  return {
    backgroundColor:'transparent',
    tooltip: Object.assign({}, tipCommon, { trigger:'item',
      formatter:function(pr){
        if (pr.seriesType === 'effectScatter'){
          var d = pr.data.raw || {};
          return '<span style="color:#07C160">'+pr.name+'</span><br/>入驻厂家:'+d.vendors+' · 客户食堂:'+d.customers;
        }
        var r = byName[pr.name];
        if (!r) return pr.name;
        return '<span style="color:#41C0FF">'+r.name+'</span><br/>入驻厂家:'+r.vendors+' · 客户食堂:'+r.customers;
      } }),
    geo:{ map:'fujian', roam:true, scaleLimit:{min:0.8,max:4},
      layoutCenter:['42%','54%'], layoutSize:'96%', zoom:1.0, aspectScale:1.0,
      label:{show:false},
      itemStyle:{ areaColor:C.MAP_EMPTY, borderColor:'rgba(127,148,238,0.55)', borderWidth:1 },
      emphasis:{ label:{show:true,color:'#fff',fontSize:13},
        itemStyle:{ areaColor:'rgba(65,192,255,0.45)', borderColor:C.PRIMARY, borderWidth:2 } },
      select:{ disabled:true },
      regions: cities.map(function(c){
        return { name:c.name,
          itemStyle:{ areaColor: regionColor(c.customers,max), borderColor:'rgba(127,148,238,0.55)', borderWidth:1 },
          label:{ show:true, color:C.TEXT, fontSize:11 } };
      })
    },
    series:[{ type:'effectScatter', coordinateSystem:'geo', silent:true, zlevel:2,
      rippleEffect:{ brushType:'stroke', scale:3, period:4 }, symbolSize:function(val){ return 6 + val[2]*1.6; },
      itemStyle:{ color:C.GREEN, shadowBlur:8, shadowColor:C.GREEN },
      data: cities.filter(function(c){ return c.vendors>0; }).map(function(c){
        return { name:c.name, value:[c.center[0],c.center[1],c.vendors], raw:{vendors:c.vendors,customers:c.customers} };
      }) }]
  };
}
function renderMap(){
  if (!charts.map) charts.map = echarts.init(el('chartMap'));
  charts.map.setOption(mapMode === 'china' ? mapOptionForChina() : mapOptionForFujian(), true);
  renderMapOverlay();
}
function renderMapOverlay(){
  var ov = el('mapOverlay');
  if (mapMode === 'china'){
    var vendors = currentRegions.reduce(function(s,p){ return s+p.vendors; },0);
    var customers = currentRegions.reduce(function(s,p){ return s+p.customers; },0);
    ov.innerHTML = stat('覆盖省份', currentRegions.length) + stat('入驻厂家', vendors) + stat('客户食堂', customers);
    el('mapTitle').textContent = '厂商 · 客户地域覆盖';
    el('mapExtra').textContent = '点击福建省可下钻';
    el('btnBack').classList.add('hidden');
    el('cityList').classList.add('hidden');
    el('mapHint').classList.remove('hidden');
    el('mapHint').innerHTML = '<span class="rmap__dot"></span>气泡=入驻厂家；色深=客户食堂密度；点击福建下钻';
  } else {
    ov.innerHTML = stat('覆盖地市', currentFujian.cities.length) +
                   stat('入驻厂家', currentFujian.vTotal) + stat('客户食堂', currentFujian.cTotal);
    el('mapTitle').textContent = '福建省 · 厂商客户分布';
    el('mapExtra').textContent = '已下钻';
    el('btnBack').classList.remove('hidden');
    el('mapHint').classList.add('hidden');
    renderCityList();
  }
  function stat(l,v){
    return '<div class="ostat"><span class="ostat__l">'+l+'</span>'+
           '<span class="ostat__v font-digital">'+v+'</span></div>';
  }
}
function renderCityList(){
  var cities = currentFujian.cities.slice().sort(function(a,b){ return b.customers-a.customers; });
  var max = cities[0].customers;
  el('cityList').classList.remove('hidden');
  el('cityList').innerHTML = cities.map(function(c){
    return '<div class="city-row"><span class="city-row__n">'+c.shortName+'</span>'+
      '<span class="city-row__bar"><i style="width:'+(c.customers/max*100).toFixed(1)+'%"></i></span>'+
      '<span class="city-row__v font-digital">'+c.customers+'</span></div>';
  }).join('');
}
charts.mapClickBound = false;
function bindMapClick(){
  if (charts.mapClickBound || !charts.map) return;
  charts.mapClickBound = true;
  charts.map.on('click', function(params){
    if (params.componentType !== 'geo' || !params.name) return;
    if (mapMode === 'china'){
      var p = currentRegions.filter(function(x){ return x.name===params.name; })[0];
      if (!p || p.adcode !== DRILLABLE) return;
      currentFujian = genFujianDetail();
      mapMode = 'fujian';
      renderMap();
    }
  });
}

function renderSrc(src){
  var o = {

    tooltip: Object.assign({}, tipCommon, { trigger:'item', formatter:function(p){ return p.name+': '+p.value+' 条'; } }),
    legend:{ show:false },

      s.name + '<span class="src-legend__v font-digital">'+s.value+'</span></div>';

var VISIBLE = 6, ITEM_STEP = 86, tickIdx = 0, tickAnim = true, tickTimer = null, alarmData = [];
function renderAlarms(list){
  alarmData = list;
  var track = el('tickerTrack');
  var all = list.concat(list.slice(0, VISIBLE));
  track.innerHTML = all.map(function(it){
    return '<div class="alarm">'+
      '<div class="alarm__lv" style="background:'+LEVEL_COLOR[it.level]+'">'+LEVEL_TEXT[it.level]+'</div>'+
      '<div class="alarm__bd">'+
        '<div class="alarm__r1"><span class="alarm__sub">'+it.subject+'</span>'+
        '<span class="alarm__time">'+it.time+'</span></div>'+
        '<div class="alarm__r2">'+it.type+' · '+it.ref+'</div>'+
        '<div class="alarm__ct">'+it.content+'</div>'+
      '</div></div>';
  }).join('');
  tickIdx = 0; tickAnim = false;
  track.classList.add('ticker__tr--no');
  track.style.transform = 'translateY(0px)';
  requestAnimationFrame(function(){
    tickAnim = true;
    track.classList.remove('ticker__tr--no');
  });
}
function tick(){
  var track = el('tickerTrack');
  if (alarmData.length <= VISIBLE){ track.style.transform = 'translateY(0px)'; return; }
  if (tickIdx >= alarmData.length){
    track.classList.add('ticker__tr--no'); tickIdx = 0; track.style.transform = 'translateY(0px)';
    requestAnimationFrame(function(){ track.classList.remove('ticker__tr--no'); });
  } else {
    tickIdx++;
    track.style.transform = 'translateY(' + (-tickIdx*ITEM_STEP) + 'px)';
  }
}
function startTick(){ stopTick(); tickTimer = setInterval(tick, 3200); }
function stopTick(){ if (tickTimer){ clearInterval(tickTimer); tickTimer = null; } }

      '<div class="score__l">'+k.label+'</div>'+

      '<div class="score__bar" style="width:'+Math.min(k.ratio*100,100).toFixed(0)+'%;background:'+k.tone+'"></div></div>';
  }).join('');
}

function fetchData(){
  /* ★ 接入真实平台时:把以下 mock 换成 fetch('/api/platform/xxx').then(r=>r.json()) */
  return Promise.resolve({
    health: genHealth(),
    business: genBusiness(),
    workOrders: genWorkOrders(),
    trends: genTrends(),
    regions: genRegions(),
    alarmLevels: genAlarmLevels(),
    alarmSource: genAlarmSource(),
    alarms: genAlarmList(),
    kpi: genKpi(),
    todos: genTodos()
  });
}
function render(d){
  renderStrip(d.health);
  renderKPI(d.business);
  renderDonut(d.business);
  renderWoStatus(d.workOrders);
  renderLoad(d.workOrders);
  renderWoTrend(d.trends);
  renderOnline(d.trends);
  renderSla(d.trends);
  currentRegions = d.regions;
  if (!currentFujian) currentFujian = genFujianDetail();
  renderMap();
  bindMapClick();
  renderLevels(d.alarmLevels);
  renderSrc(d.alarmSource);
  renderAlarms(d.alarms);
  renderKpiScore(d.kpi);
  renderTodos(d.todos);
}
function loadAll(){
  return fetchData().then(render).catch(function(e){ console.error('[平台大屏] 数据刷新失败,保持原值:', e); });
}

/* ---------------- 时钟 ---------------- */
var WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function tickClock(){
  var d = new Date();
  el('clockDate').textContent = d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+WEEK[d.getDay()];
  el('clockTime').textContent = p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
}

/* ---------------- 等比缩放 ---------------- */
function fitScreen(){
  var s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  el('screen').style.transform = 'scale('+s+')';
}
window.addEventListener('resize', function(){
  fitScreen();
  Object.keys(charts).forEach(function(k){ if (charts[k]) charts[k].resize(); });
});

/* ---------------- 启动 ---------------- */
el('btnBack').addEventListener('click', function(){ mapMode = 'china'; renderMap(); });
el('ticker').addEventListener('mouseenter', stopTick);
el('ticker').addEventListener('mouseleave', startTick);
el('btnFull').addEventListener('click', function(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
});

fitScreen();
tickClock();
loadAll();
startTick();
setInterval(tickClock, 1000);
setInterval(loadAll, 60000);

/* 调试钩子 */
window.__iot = {
  get charts(){ return charts; },
  get mapMode(){ return mapMode; },
  drill: function(){ currentFujian = genFujianDetail(); mapMode='fujian'; renderMap(); },
  back:  function(){ mapMode='china'; renderMap(); }
};
})();
